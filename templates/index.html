<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дискойн — Профиль участника и переводы</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- IBM Plex Mono Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Loading State -->
        <div id="loadingScreen" class="loading-container">
            Загрузка…
        </div>

        <!-- Profile Setup Screen (If not logged in) -->
        <div id="loginScreen" class="screen-container hidden">
            <div class="login-card">
                <div class="login-header">
                    <div class="tag-title" id="loginTag">🪙 ПРОФИЛЬ УЧАСТНИКА</div>
                    <div class="login-coin-name" id="loginCoinName">Дискойн</div>
                </div>
                <div class="login-body">
                    <div class="login-hint">Введите имя, чтобы войти или создать участника</div>
                    <input type="text" id="nameInput" placeholder="Ваше имя" class="mono-input" />
                    <button id="createProfileBtn" class="mono-btn btn-black">Войти</button>
                    <div id="existingAccHint" class="login-subtext"></div>
                </div>
            </div>
        </div>

        <!-- Main Dashboard Screen -->
        <div id="mainScreen" class="main-wrapper hidden">
            <div class="tracker-container">
                <!-- Header: Coin Value -->
                <div class="block header-block">
                    <div class="tag-title">КУРС МОНЕТЫ</div>
                    <div class="coin-title-row">
                        <span class="coin-display-title" id="coinTitleDisplay">🪙 Дискойн</span>
                    </div>

                    <div id="coinValueDisplay" class="coin-value-line" title="Нажмите, чтобы изменить курс">
                        1 <span id="coinSymbolText">🪙</span> = <span id="coinRateText">12.50</span> ₽
                        <span class="edit-label">(изменить)</span>
                    </div>

                    <!-- Edit Value Form -->
                    <form id="editValueForm" class="edit-rate-form hidden">
                        <input type="number" step="any" id="valueInput" class="mono-input rate-input" />
                        <button type="submit" class="mono-btn btn-black btn-sm">ОК</button>
                        <button type="button" id="cancelEditValueBtn" class="mono-btn btn-outline btn-sm">Отмена</button>
                    </form>
                </div>

                <!-- Profile + Transfer Band -->
                <div class="block profile-block">
                    <div class="profile-header-row">
                        <div>
                            <div class="tag-title tag-dark">МОЙ ПРОФИЛЬ</div>
                            <div class="profile-name" id="profileNameDisplay">Участник</div>
                            <div class="profile-balance" id="profileBalanceDisplay">100 🪙</div>
                        </div>
                        <button id="switchProfileBtn" class="mono-btn btn-outline btn-xs">сменить</button>
                    </div>

                    <!-- Transfer Form -->
                    <div class="transfer-section">
                        <div class="tag-title tag-dark transfer-tag">ПЕРЕВОД МОНЕТ</div>
                        <form id="transferForm" class="transfer-form">
                            <select id="toIdSelect" class="mono-input mono-select">
                                <option value="">Получатель…</option>
                            </select>

                            <div class="transfer-input-group">
                                <input type="number" step="any" id="transferAmountInput" placeholder="Сумма в 🪙" class="mono-input amount-input" inputmode="decimal" />
                                <button type="submit" id="submitTransferBtn" class="mono-btn btn-black">Отправить</button>
                            </div>

                            <div id="txErrorMsg" class="alert-msg error-msg hidden"></div>
                            <div id="txOkMsg" class="alert-msg success-msg hidden"></div>
                        </form>
                    </div>
                </div>

                <!-- Participants Table -->
                <div class="block accounts-block">
                    <div class="tag-title tag-green" id="accountsCountTag">УЧАСТНИКИ: 0</div>
                    <div id="accountsList" class="accounts-list">
                        <!-- Rows rendered dynamically -->
                    </div>
                </div>

                <!-- Transaction Log -->
                <div class="block tx-block">
                    <div class="tag-title" id="txCountTag">ТРАНЗАКЦИИ: 0</div>
                    <div id="txEmptyMsg" class="tx-empty">Транзакций пока нет.</div>
                    <div id="txList" class="tx-list">
                        <!-- Transactions rendered dynamically -->
                    </div>
                </div>

                <!-- Global Error Bar -->
                <div id="globalErrorBar" class="error-bar hidden"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
